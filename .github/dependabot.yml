version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # The engine and VS Code types move together in a reviewed compatibility change.
      - dependency-name: '@types/vscode'
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
